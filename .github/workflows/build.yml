# msquic, built with BinaryBuilder on GitHub's Linux runners, one platform per job, in
# parallel. The deploy job, started by hand, waits for all of them, collects the tarballs
# and publishes this repo as a JLL package with --skip-build: the wrapper code on main, the
# tarballs on a Release. It runs here, in the JLL's own repo, so the default GITHUB_TOKEN is
# enough.
name: msquic_jll

on:
  push:
    branches: [main]
    paths: [build_tarballs.jl, .github/workflows/build.yml]
  pull_request:
    paths: [build_tarballs.jl, .github/workflows/build.yml]
  workflow_dispatch:
    inputs:
      deploy:
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: Install BinaryBuilder
        run: julia -e 'using Pkg; Pkg.add("BinaryBuilder")'
      - name: Collect the tarballs from every platform
        uses: actions/download-artifact@v7
        with:
          pattern: msquic-*
          path: products
          merge-multiple: true
      - run: ls -la products
      - name: Publish (wrapper to main, tarballs to a Release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia build_tarballs.jl --verbose --skip-build --deploy=f3liz-casa/msquic_jll.jl
